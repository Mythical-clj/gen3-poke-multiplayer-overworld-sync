name: Build Windows exe
on:
  workflow_dispatch:
  push:
    paths: ["net/**", ".github/workflows/build-exe.yml"]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pyusb libusb-package
      - name: Build
        shell: bash
        run: |
          cd net
          ADD=""
          for f in client.py relay.py relay_ws.py mb_multi.py usb_link.py finto_club.py; do
            ADD="$ADD --add-data $f;."
          done
          pyinstaller --onefile --console --name gblink \
            $ADD --add-data "mappa.html;." --add-data "img;img" --add-data "../web/fonts;fonts" \
            --collect-binaries libusb_package --collect-submodules usb \
            --hidden-import tkinter --hidden-import tkinter.ttk \
            --hidden-import http.server --hidden-import tkinter.filedialog --hidden-import tkinter.messagebox \
            --paths . gui.py
      - name: Check it starts
        shell: bash
        run: |
          cd net
          ./dist/gblink.exe -u relay.py --help | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: gblink-windows
          path: net/dist/gblink.exe
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=client-$(date -u +%Y%m%d-%H%M)
          gh release create "$TAG" net/dist/gblink.exe --title "Client $TAG" --notes "gblink.exe: a standalone window, no browser and no Python needed. One small window plus a live map in your browser. Put mbstub.gba and the mappa folder next to it (or pick them with the buttons)."
