name: Build Windows exe and Mac app
on:
  workflow_dispatch:
  push:
    paths: ["net/**", "hw/mbstub/**", "payload/**", "build.ps1", ".github/workflows/build-exe.yml"]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pyusb libusb-package
      - name: Arm toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R xpack-dev-tools/arm-none-eabi-gcc-xpack --limit 60 --json tagName -q '.[].tagName' | grep '^v14\.' | head -1)
          echo "xpack arm-none-eabi-gcc $TAG"
          gh release download "$TAG" -R xpack-dev-tools/arm-none-eabi-gcc-xpack --pattern '*win32-x64.zip' --dir tc
          7z x tc/*win32-x64.zip -otc/x > /dev/null
          BIN=$(ls -d tc/x/*/bin | head -1)
          echo "$(cygpath -w "$PWD/$BIN")" >> "$GITHUB_PATH"
      - name: Header with the multiboot logo
        shell: bash
        run: |
          python -c "
          d = bytearray(0xC0)
          d[4:0xA0] = open('hw/mbstub/logo.bin', 'rb').read()
          d[0xB0:0xB2] = b'01'
          open('logo-header.gba', 'wb').write(d)
          "
      - name: Build mbstub.gba (the multiboot program)
        shell: powershell
        run: |
          arm-none-eabi-gcc --version
          .\hw\mbstub\build.ps1 -Syms tutte -LogoFrom "$PWD\logo-header.gba"
          Copy-Item hw\mbstub\build\mbstub.gba net\mbstub.gba
          Get-Item net\mbstub.gba
      - name: Build
        shell: bash
        run: |
          cd net
          ADD=""
          for f in client.py relay.py relay_ws.py mb_multi.py usb_link.py finto_club.py; do
            ADD="$ADD --add-data $f;."
          done
          pyinstaller --onefile --console --name gblink \
            $ADD --add-data "mappa.html;." --add-data "mbstub.gba;." --add-data "img;img" --add-data "mappa;mappa" --add-data "../web/fonts;fonts" \
            --collect-binaries libusb_package --collect-submodules usb \
            --hidden-import tkinter --hidden-import tkinter.ttk \
            --hidden-import http.server --hidden-import tkinter.filedialog --hidden-import tkinter.messagebox \
            --paths . gui.py
      - name: Check it starts
        shell: bash
        run: |
          cd net
          ./dist/gblink.exe -u relay.py --help | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: gblink-windows
          path: net/dist/gblink.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mbstub
          path: net/mbstub.gba
      - name: Release
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=client-$(date -u +%Y%m%d-%H%M)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" net/dist/gblink.exe net/mbstub.gba --title "Client $TAG" --notes "gblink.exe: a standalone window, no browser and no Python needed. One small window plus a live map in your browser. The multiboot stub and the map data are inside; nothing else to install."

  mac:
    needs: exe
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: apple-silicon
          - os: macos-15-intel
            name: intel
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pyusb libusb-package
      - uses: actions/download-artifact@v4
        with:
          name: mbstub
          path: net
      - name: Build the app
        run: |
          cd net
          ADD=""
          for f in client.py relay.py relay_ws.py mb_multi.py usb_link.py finto_club.py; do
            ADD="$ADD --add-data $f:."
          done
          pyinstaller --onedir --windowed --name gblink --noconfirm \
            $ADD --add-data "mappa.html:." --add-data "mbstub.gba:." --add-data "img:img" --add-data "mappa:mappa" --add-data "../web/fonts:fonts" \
            --collect-binaries libusb_package --collect-submodules usb \
            --hidden-import tkinter --hidden-import tkinter.ttk \
            --hidden-import http.server --hidden-import tkinter.filedialog --hidden-import tkinter.messagebox \
            --paths . gui.py
      - name: Check it starts
        run: |
          cd net
          ./dist/gblink.app/Contents/MacOS/gblink -u relay.py --help | head -3
          python -c "import tkinter; print('tk', tkinter.TkVersion)"
          codesign -dv dist/gblink.app 2>&1 | head -3 || true
      - name: Pack
        run: |
          cd net/dist
          cat > READ-ME-FIRST.txt <<'EOF'
          gblink for Mac
          1. Unzip and drag gblink to Applications (or leave it anywhere).
          2. The first time: right-click gblink, choose Open, then Open again.
             (If macOS still refuses: System Settings > Privacy & Security >
             scroll down > Open Anyway.)
          3. Plug the adapter in, press Play.
          No driver and no Terminal needed.
          EOF
          mkdir pack && cp -R gblink.app READ-ME-FIRST.txt pack/
          ditto -c -k --keepParent pack gblink-mac-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gblink-mac-${{ matrix.name }}
          path: net/dist/gblink-mac-${{ matrix.name }}.zip
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.exe.outputs.tag }}" net/dist/gblink-mac-${{ matrix.name }}.zip
